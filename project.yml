name: PawprintDays
options:
  bundleIdPrefix: com.pawprintdays
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: zh-Hant
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G9CBH6VR3R
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PawprintDays:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PawprintDays
        excludes:
          - "**/.DS_Store"
          - "Resources/PetFrames"
          - "Resources/PetFrames/**"
      - path: PawprintDays/Resources/PetFrames
        type: folder
        buildPhase: resources
    dependencies:
      - target: PawprintDaysWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawprintdays.app
        PRODUCT_NAME: PawprintDays
        INFOPLIST_FILE: PawprintDays/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    info:
      path: PawprintDays/Resources/Info.plist
      properties:
        CFBundleDisplayName: 足印日記
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.pawprintdays.app
            CFBundleURLSchemes:
              - pawprintdays
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: 足印日記需要你的精準位置，才能在真實巷口遇見奇幻毛孩、計算 75 公尺街角距離並繪製散步水彩軌跡。精準位置只留在你的手機上；為了讓小窩的天氣跟現實同步，僅會送出約 1 公里的模糊位置。
        NSLocationAlwaysAndWhenInUseUsageDescription: 僅在你主動開啟「替我記住停留較久的街角」時使用，用來在私密本機日記記錄停留片段。
        NSLocationTemporaryUsageDescriptionDictionary:
          PreciseNeighborhoodWalk: 需要暫時開啟精準定位，以準確判斷 75 公尺內的街角足印與繪製散步路線。
        NSMotionUsageDescription: 足印日記透過計步器將你的日常步行自動換算為步數幣與口袋拾遺進度（不上傳任何健康資料）。
  PawprintDaysWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PawprintDaysWidgets
      - path: PawprintDays/Shared/PawprintSharedActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawprintdays.app.widgets
        PRODUCT_NAME: PawprintDaysWidgets
        INFOPLIST_FILE: PawprintDaysWidgets/Info.plist
        SKIP_INSTALL: YES
    info:
      path: PawprintDaysWidgets/Info.plist
      properties:
        CFBundleDisplayName: 足印日記小工具
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PawprintDaysTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PawprintDaysTests
    dependencies:
      - target: PawprintDays
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawprintdays.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PawprintDays.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PawprintDays"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PawprintDays:
    build:
      targets:
        PawprintDays: all
        PawprintDaysTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PawprintDaysTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
